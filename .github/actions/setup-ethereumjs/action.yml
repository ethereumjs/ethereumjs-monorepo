name: Setup EthereumJS
description: Restore this run's built workspace, install on cache miss. Callers must checkout first so this local action can be resolved.

inputs:
  dep-cache-key:
    description: Full-workspace cache key from the build job (`none` skips restore)
    required: false
    default: 'none'
  node-version:
    description: Node.js version
    required: false
    default: '26'
  install-command:
    description: Install command used when the workspace cache misses
    required: false
    default: 'npm ci'
runs:
  using: composite
  steps:
    - if: ${{ inputs.dep-cache-key != 'none' }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: dep-cache
      with:
        path: ${{ github.workspace }}
        key: ${{ inputs.dep-cache-key }}

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - if: ${{ steps.dep-cache.outputs.cache-hit != 'true' }}
      name: Install dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: ${{ inputs.install-command }}
