name: VM consensus fixtures cache

on:
  push:
    branches: [master]
    paths:
      - 'packages/vm/test/consensus/fixtures.json'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  EST_FIXTURES_CACHE: ${{ github.workspace }}/.est-fixtures-cache

defaults:
  run:
    working-directory: packages/vm

jobs:
  warm-est-fixtures:
    if: github.repository == 'ethereumjs/ethereumjs-monorepo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: est-cache
        with:
          path: .est-fixtures-cache
          key: est-${{ hashFiles('packages/vm/test/consensus/fixtures.json') }}

      - name: Fetch and extract EST fixtures
        if: steps.est-cache.outputs.cache-hit != 'true'
        run: npm run fixtures:fetch -- tests
