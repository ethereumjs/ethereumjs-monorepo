name: RLP/Ethash/Genesis/Wallet Build
on:
  workflow_call:
    inputs:
      dep-cache-key:
        required: true
        type: string
      run-coverage:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      dep-cache-key:
        required: false
        default: 'none'
      run-coverage:
        required: false
        type: boolean
        default: true

env:
  cwd: ${{github.workspace}}/packages/rlp
  RUN_COVERAGE: ${{ inputs.run-coverage }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-static
  cancel-in-progress: true

jobs:
  test-static:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}

      - name: Test rlp
        run: |
          if [ "$RUN_COVERAGE" = "false" ]; then
            npm run test:node
          else
            npm run coverage
          fi
        working-directory: ${{ github.workspace }}/packages/rlp

      - name: Test genesis
        run: |
          if [ "$RUN_COVERAGE" = "false" ]; then
            npm run test:node
          else
            npm run coverage
          fi
        working-directory: ${{ github.workspace }}/packages/genesis

      - if: env.RUN_COVERAGE != 'false'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.cwd }}/coverage/lcov.info
          flags: static
