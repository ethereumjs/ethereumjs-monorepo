name: VM EST dev
on:
  workflow_call:
    inputs:
      dep-cache-key:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      dep-cache-key:
        required: false
        default: 'none'

env:
  cwd: ${{github.workspace}}/packages/vm

defaults:
  run:
    working-directory: packages/vm

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-vm-est-dev
  cancel-in-progress: true

jobs:
  # In-flux hardfork working-ground: expected to fail. continue-on-error plus
  # omission from Build / CI means this cannot delay or fail the merge gate.
  vm-est-dev-state:
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
          execution-spec-tests: 'true'

      - if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip dev VM') == false
        run: npm run test:est:dev:state

      - if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip dev VM')
        run: npm run test:buildIntegrity

  vm-est-dev-blockchain:
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
          execution-spec-tests: 'true'

      - if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip dev VM') == false
        run: npm run test:est:dev:blockchain

      - if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip dev VM')
        run: npm run test:buildIntegrity
