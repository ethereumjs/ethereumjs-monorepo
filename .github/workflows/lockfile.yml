name: lockfile-lint

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Job id `root` is a required branch-protection check (lockfile-lint on package-lock.json).
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Detect lockfile changes in PR
        id: lockfile
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qE '^(package-lock\.json|\.github/workflows/lockfile\.yml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 26
        if: steps.lockfile.outputs.changed == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: 'npm'

      - name: lockfile-lint
        if: steps.lockfile.outputs.changed == 'true'
        run: npm install lockfile-lint-api && node scripts/lockfile-lint.js

      - name: Skip lockfile-lint (no lockfile changes)
        if: steps.lockfile.outputs.changed != 'true'
        run: echo "No package-lock.json or lockfile workflow changes in this PR."
