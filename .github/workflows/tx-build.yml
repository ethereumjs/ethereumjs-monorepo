name: Tx
on:
  workflow_call:
    inputs:
      dep-cache-key:
        required: true
        type: string
      run-coverage:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      dep-cache-key:
        required: false
        default: 'none'
      run-coverage:
        required: false
        type: boolean
        default: true

env:
  cwd: ${{github.workspace}}/packages/tx
  RUN_COVERAGE: ${{ inputs.run-coverage }}
  LEGACY_ETHEREUM_TESTS_CACHE: ${{ github.workspace }}/.legacy-ethereum-tests-cache

defaults:
  run:
    working-directory: packages/tx

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-tx
  cancel-in-progress: true

jobs:
  test-tx:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}

      - uses: ./.github/actions/legacy-ethereum-tests
        with:
          slice: transaction
          cache-key: legacy-tests-${{ hashFiles('config/legacy-ethereum-tests.json') }}-transaction

      # coverage excludes transactionRunner / t9n; always run those via test:node
      - run: npm run test:node
      - if: env.RUN_COVERAGE != 'false'
        run: npm run coverage
      - if: env.RUN_COVERAGE != 'false'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.cwd }}/coverage/lcov.info
          flags: tx
