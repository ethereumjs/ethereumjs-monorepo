name: VM Nightly
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

env:
  cwd: ${{github.workspace}}/packages/vm
  EST_FIXTURES_CACHE: ${{ github.workspace }}/.est-fixtures-cache
  FIXTURES_HASH: ${{ hashFiles('packages/vm/test/consensus/fixtures.json') }}

defaults:
  run:
    working-directory: packages/vm

jobs:
  test-vm-api:
    if: github.repository == 'ethereumjs/ethereumjs-monorepo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        working-directory: ${{github.workspace}}

      - run: npm run test:API

  nightly-est-fork-matrix:
    if: github.repository == 'ethereumjs/ethereumjs-monorepo'
    runs-on: ubuntu-latest
    outputs:
      forks: ${{ steps.matrix.outputs.forks }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm
      - name: Install Dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}
      - id: matrix
        working-directory: packages/vm
        run: echo "forks=$(npx tsx ./test/consensus/scripts/printEstForkMatrix.ts)" >> $GITHUB_OUTPUT

  test-vm-consensus-est:
    needs: nightly-est-fork-matrix
    if: github.repository == 'ethereumjs/ethereumjs-monorepo'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fork: ${{ fromJson(needs.nightly-est-fork-matrix.outputs.forks) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        working-directory: ${{github.workspace}}

      - uses: ./.github/actions/consensus-fork
        with:
          source: tests
          manifest: fixtures.json
          cache-key: est-extract-tests-${{ env.FIXTURES_HASH }}-${{ matrix.fork }}
          fork: ${{ matrix.fork }}
          artifact-prefix: consensus-est-failures
          save-cache: 'false'
          extra-test-args: '--run-skipped slow'

  test-vm-consensus-legacy:
    if: github.repository == 'ethereumjs/ethereumjs-monorepo'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        legacy_fork:
          [
            'Prague',
            'Cancun',
            'Shanghai',
            'Paris',
            'London',
            'Berlin',
            'Istanbul',
            'ConstantinopleFix',
            'Byzantium',
            'EIP158',
            'EIP150',
            'Homestead',
            'Frontier',
            'ByzantiumToConstantinopleFixAt5',
            'EIP158ToByzantiumAt5',
            'FrontierToHomesteadAt5',
            'HomesteadToDaoAt5',
            'HomesteadToEIP150At5',
            'BerlinToLondonAt5',
          ]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        working-directory: ${{github.workspace}}

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: submodules-cache
        with:
          path: ${{github.workspace}}/packages/ethereum-tests
          key: ethereum-tests-${{ hashFiles('.gitmodules') }}-${{ github.sha }}

      - name: Initialize submodules (if not cached)
        if: steps.submodules-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth=1 -- packages/ethereum-tests

      - run: npm run test:consensus -- --source legacy --format blockchain --legacy-fork ${{ matrix.legacy_fork }} --run-skipped slow

  test-vm-slow:
    if: github.repository == 'ethereumjs/ethereumjs-monorepo'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        testFile:
          [
            'Call50000_sha256',
            'CALLBlake2f_MaxRounds',
            'Return50000',
            'Return50000_2',
            'static_Call50000_sha256',
            'loopMul',
            'loopExp',
          ]
      fail-fast: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        working-directory: ${{github.workspace}}

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: submodules-cache
        with:
          path: ${{github.workspace}}/packages/ethereum-tests
          key: ethereum-tests-${{ hashFiles('.gitmodules') }}-${{ github.sha }}

      - name: Initialize submodules (if not cached)
        if: steps.submodules-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth=1 -- packages/ethereum-tests

      - run: npm run test:consensus -- --source legacy --format blockchain --legacy-fork Prague --file=${{ matrix.testFile }} --run-skipped slow
