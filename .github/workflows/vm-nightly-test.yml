name: VM Nightly
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

env:
  cwd: ${{github.workspace}}/packages/vm

defaults:
  run:
    working-directory: packages/vm

jobs:
  test-vm-api:
    if: github.repository == 'ethereumjs/ethereumjs-monorepo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
        working-directory: ${{github.workspace}}

      - run: npm run test:API
  #     - run: npm run test:API:browser

  test-vm-state:
    if: github.repository == 'ethereumjs/ethereumjs-monorepo'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fork:
          [
            'Prague',
            'Chainstart',
            'Homestead',
            'dao',
            'TangerineWhistle',
            'SpuriousDragon',
            'Byzantium',
            'Constantinople',
            'Petersburg',
            'Istanbul',
            'MuirGlacier',
            'Berlin',
            'London',
            'Paris',
            'Shanghai',
            'Cancun',
            'ByzantiumToConstantinopleFixAt5',
            'EIP158ToByzantiumAt5',
            'FrontierToHomesteadAt5',
            'HomesteadToDaoAt5',
            'HomesteadToEIP150At5',
            'BerlinToLondonAt5',
          ]
      fail-fast: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        working-directory: ${{github.workspace}}

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: submodules-cache
        with:
          path: ${{github.workspace}}/packages/ethereum-tests
          key: ethereum-tests-${{ hashFiles('.gitmodules') }}-${{ github.sha }}

      - name: Initialize submodules (if not cached)
        if: steps.submodules-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive

      - run: npm run test:state -- --fork=${{ matrix.fork }} --verify-test-amount-alltests

  test-vm-blockchain:
    if: github.repository == 'ethereumjs/ethereumjs-monorepo'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fork:
          [
            'Prague',
            'Chainstart',
            'Homestead',
            'dao',
            'TangerineWhistle',
            'SpuriousDragon',
            'Byzantium',
            'Constantinople',
            'Petersburg',
            'Istanbul',
            'MuirGlacier',
            'Berlin',
            'London',
            'Paris',
            'Shanghai',
            'Cancun',
            'ByzantiumToConstantinopleFixAt5',
            'EIP158ToByzantiumAt5',
            'FrontierToHomesteadAt5',
            'HomesteadToDaoAt5',
            'HomesteadToEIP150At5',
            'BerlinToLondonAt5',
          ]
      fail-fast: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        working-directory: ${{github.workspace}}

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: submodules-cache
        with:
          path: ${{github.workspace}}/packages/ethereum-tests
          key: ethereum-tests-${{ hashFiles('.gitmodules') }}-${{ github.sha }}

      - name: Initialize submodules (if not cached)
        if: steps.submodules-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive

      - run: npm run test:blockchain -- --fork=${{ matrix.fork }} --verify-test-amount-alltests

  test-vm-slow:
    if: github.repository == 'ethereumjs/ethereumjs-monorepo'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        testFile:
          [
            '^Call50000_sha256',
            '^CALLBlake2f_MaxRounds',
            '^Return50000',
            '^Return50000_2',
            '^static_Call50000_sha256',
            '^loopMul',
            '^loopExp',
          ]
      fail-fast: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        working-directory: ${{github.workspace}}

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: submodules-cache
        with:
          path: ${{github.workspace}}/packages/ethereum-tests
          key: ethereum-tests-${{ hashFiles('.gitmodules') }}-${{ github.sha }}

      - name: Initialize submodules (if not cached)
        if: steps.submodules-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive

      - run: npm run test:state -- --file=${{ matrix.testFile }} --runSkipped=slow
