name: VM consensus dev (Hegota)

on:
  workflow_call:
    inputs:
      dep-cache-key:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      dep-cache-key:
        required: false
        default: 'none'

env:
  EST_FIXTURES_CACHE: ${{ github.workspace }}/.est-fixtures-cache
  cwd: ${{ github.workspace }}/packages/vm

defaults:
  run:
    working-directory: packages/vm

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-vm-consensus-dev
  cancel-in-progress: true

jobs:
  vm-consensus-bogota:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: state
            shard: '0/2'
          - format: state
            shard: '1/2'
          - format: blockchain
            shard: '0/2'
          - format: blockchain
            shard: '1/2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .est-fixtures-cache
          key: est-${{ hashFiles('packages/vm/test/consensus/fixtures.json') }}
          restore-keys: |
            est-${{ hashFiles('packages/vm/test/consensus/fixtures.json') }}

      - name: Ensure bogota-devnet fixtures
        run: npm run fixtures:fetch -- bogota-devnet

      - name: Run bogota-devnet consensus
        run: npm run test:consensus:dev -- --format ${{ matrix.format }} --shard ${{ matrix.shard }}
