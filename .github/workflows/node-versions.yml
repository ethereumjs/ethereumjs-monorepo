name: Node versions
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

env:
  LEGACY_ETHEREUM_TESTS_CACHE: ${{ github.workspace }}/.legacy-ethereum-tests-cache

jobs:
  tests:
    if: github.repository == 'ethereumjs/ethereumjs-monorepo'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
      fail-fast: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - uses: ./.github/actions/legacy-ethereum-tests
        with:
          slice: transaction
          cache-key: legacy-tests-${{ hashFiles('config/legacy-ethereum-tests.json') }}-transaction

      - name: Test Block
        run: npm run test:node
        working-directory: packages/block

      - name: Test Blockchain
        run: npm run test:node
        working-directory: packages/blockchain

      - name: Test Common
        run: npm run test:node
        working-directory: packages/common

      - name: Test devp2p
        run: npm run test:node
        working-directory: packages/devp2p

      - name: Test Ethash
        run: npm run test
        working-directory: packages/ethash

      - name: Test EVM
        run: npm run test:node
        working-directory: packages/evm

      - name: Test MPT
        run: npm run test:node
        working-directory: packages/mpt

      - name: Test Tx
        run: npm run test:node
        working-directory: packages/tx

      - name: Test Util
        run: npm run test:node
        working-directory: packages/util

      - name: Test StateManager
        run: npm run test:node
        working-directory: packages/statemanager

      - name: Test VM
        run: npm run test:API
        working-directory: packages/vm

      - name: Test RLP
        run: npm run test:node
        working-directory: packages/rlp

      - name: Test Wallet
        run: npm run test:node
        working-directory: packages/wallet
