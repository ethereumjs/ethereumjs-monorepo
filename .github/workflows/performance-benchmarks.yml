name: Performance benchmarks

# CodSpeed simulation on master (path-filtered) and manual dispatch.
# Pull requests use the performance-benchmarks job in build.yml (test: performance).
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: performance-benchmarks-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  performance-benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Bench-relevant paths
        id: bench-paths
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "bench=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BEFORE"
          bench=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              packages/binarytree/*|packages/block/*|packages/evm/*|packages/mpt/*|packages/rlp/*|packages/statemanager/*|packages/tx/*|packages/util/*|packages/vm/*|config/vitest-bench.mts|.github/workflows/build.yml|.github/workflows/performance-benchmarks.yml|package.json|package-lock.json)
                bench=true
                break
                ;;
            esac
          done <<< "$(git diff --name-only "$BEFORE" "$SHA")"
          echo "bench=$bench" >> "$GITHUB_OUTPUT"

      - name: No bench-relevant changes
        if: github.event_name == 'push' && steps.bench-paths.outputs.bench != 'true'
        run: echo "Skipping — no performance benchmark paths in this push."

      # @codspeed/core 5.x prebuilds target Node 22 (Node 26 Linux hits V8 ABI errors).
      - uses: ./.github/actions/setup-ethereumjs
        if: github.event_name == 'workflow_dispatch' || steps.bench-paths.outputs.bench == 'true'
        with:
          dep-cache-key: none
          node-version: '22'

      - name: Rebuild CodSpeed native module for bench Node
        if: github.event_name == 'workflow_dispatch' || steps.bench-paths.outputs.bench == 'true'
        run: npm rebuild @codspeed/core
        working-directory: ${{ github.workspace }}

      - name: Run benchmarks
        if: github.event_name == 'workflow_dispatch' || steps.bench-paths.outputs.bench == 'true'
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          mode: simulation
          run: npm run bench
          cache-instruments: 'true'
