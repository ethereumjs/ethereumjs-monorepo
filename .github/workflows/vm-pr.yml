name: VM
on:
  workflow_call:
    inputs:
      dep-cache-key:
        required: true
        type: string
      submodule-cache-key:
        required: true
        type: string
      run-coverage:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      dep-cache-key:
        required: false
        default: 'none'
      submodule-cache-key:
        required: false
        default: 'none'
      run-coverage:
        required: false
        type: boolean
        default: true

env:
  cwd: ${{github.workspace}}/packages/vm
  RUN_COVERAGE: ${{ inputs.run-coverage }}

defaults:
  run:
    working-directory: packages/vm

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-vm-pr
  cancel-in-progress: true

jobs:
  vm-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
          ethereum-tests: 'true'
          ethereum-tests-key: ${{ inputs.submodule-cache-key }}

      - run: |
          if [ "$RUN_COVERAGE" = "false" ]; then
            npm run test:API
          else
            npm run coverage
          fi

      - if: env.RUN_COVERAGE != 'false'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.cwd }}/coverage/lcov.info
          flags: vm

  vm-state:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fork: ['Prague']
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
          ethereum-tests: 'true'
          ethereum-tests-key: ${{ inputs.submodule-cache-key }}

      - if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip most stable VM') == false
        run: npm run test:state -- --fork=${{ matrix.fork }} --verify-test-amount-alltests

      - if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip most stable VM')
        run: npm run test:buildIntegrity

  vm-est-stable-state:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
          execution-spec-tests: 'true'

      - if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip most stable VM') == false
        run: npm run test:est:stable:state

      - if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip most stable VM')
        run: npm run test:buildIntegrity

  vm-est-stable-blockchain:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
          execution-spec-tests: 'true'

      - if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip most stable VM') == false
        run: npm run test:est:stable:blockchain

      - if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip most stable VM')
        run: npm run test:buildIntegrity

  vm-state-extended:
    if: contains(join(github.event.pull_request.labels.*.name, ' '), 'test all hardforks')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fork:
          [
            'Cancun',
            'Shanghai',
            'Paris',
            'London',
            'Berlin',
            'MuirGlacier',
            'Istanbul',
            'Petersburg',
            'Constantinople',
            'Byzantium',
            'SpuriousDragon',
            'TangerineWhistle',
            'Homestead',
            'Chainstart',
          ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
          ethereum-tests: 'true'
          ethereum-tests-key: ${{ inputs.submodule-cache-key }}

      - run: npm run test:state -- --fork=${{ matrix.fork }} --verify-test-amount-alltests

  vm-blockchain:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Args to pass to the blockchain Vitest wrapper. Note that some have split the slow tests and only
        # run on forks where applicable (see PR #489 for numbers on these)

        # Tests were split with --dir and --excludeDir to balance execution times below the 9min mark.
        args:
          [
            '--fork=Prague --verify-test-amount-alltests',
          ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
          ethereum-tests: 'true'
          ethereum-tests-key: ${{ inputs.submodule-cache-key }}

      - if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip most stable VM') == false
        run: npm run test:blockchain -- ${{ matrix.args }}

      - if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip most stable VM')
        run: npm run test:blockchain:buildIntegrity

  vm-blockchain-extended:
    if: contains(join(github.event.pull_request.labels.*.name, ' '), 'test all hardforks')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Args to pass to the blockchain Vitest wrapper.
        args:
          [
            '--fork=Chainstart --verify-test-amount-alltests',
            '--fork=Homestead --verify-test-amount-alltests',
            '--fork=TangerineWhistle --verify-test-amount-alltests',
            '--fork=SpuriousDragon --verify-test-amount-alltests',
            '--fork=Byzantium --verify-test-amount-alltests',
            '--fork=Constantinople --verify-test-amount-alltests',
            '--fork=Petersburg --verify-test-amount-alltests',
            '--fork=Istanbul --verify-test-amount-alltests',
            '--fork=MuirGlacier --verify-test-amount-alltests',
            '--fork=Berlin --verify-test-amount-alltests',
            '--fork=London --verify-test-amount-alltests',
            '--fork=Paris --verify-test-amount-alltests',
            '--fork=Shanghai --verify-test-amount-alltests',
            '--fork=Cancun --verify-test-amount-alltests',
            '--fork=ByzantiumToConstantinopleFixAt5 --verify-test-amount-alltests',
            '--fork=EIP158ToByzantiumAt5 --verify-test-amount-alltests',
            '--fork=FrontierToHomesteadAt5 --verify-test-amount-alltests',
            '--fork=HomesteadToDaoAt5 --verify-test-amount-alltests',
            '--fork=HomesteadToEIP150At5 --verify-test-amount-alltests',
            '--fork=BerlinToLondonAt5 --verify-test-amount-alltests',
          ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
          ethereum-tests: 'true'
          ethereum-tests-key: ${{ inputs.submodule-cache-key }}

      - run: npm run test:blockchain -- ${{ matrix.args }}
