name: VM
on:
  workflow_call:
    inputs:
      dep-cache-key:
        required: true
        type: string
      submodule-cache-key:
        required: true
        type: string
      run-coverage:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      dep-cache-key:
        required: false
        default: 'none'
      submodule-cache-key:
        required: false
        default: 'none'
      run-coverage:
        required: false
        type: boolean
        default: true

env:
  cwd: ${{github.workspace}}/packages/vm
  RUN_COVERAGE: ${{ inputs.run-coverage }}
  EST_FIXTURES_CACHE: ${{ github.workspace }}/.est-fixtures-cache

defaults:
  run:
    working-directory: packages/vm

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-vm-pr
  cancel-in-progress: true

jobs:
  vm-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
          ethereum-tests: 'true'
          ethereum-tests-key: ${{ inputs.submodule-cache-key }}

      - run: |
          if [ "$RUN_COVERAGE" = "false" ]; then
            npm run test:API
          else
            npm run coverage
          fi

      - if: env.RUN_COVERAGE != 'false'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.cwd }}/coverage/lcov.info
          flags: vm

  vm-consensus-smoke:
    if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip most stable VM')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
      - run: npm run test:consensus:smoke

  consensus-est-fork-matrix:
    if: >-
      contains(join(github.event.pull_request.labels.*.name, ' '), 'skip most stable VM') == false &&
      contains(join(github.event.pull_request.labels.*.name, ' '), 'test all hardforks')
    runs-on: ubuntu-latest
    outputs:
      forks: ${{ steps.matrix.outputs.forks }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
      - id: matrix
        run: echo "forks=$(npx tsx ./test/consensus/scripts/printEstForkMatrix.ts)" >> $GITHUB_OUTPUT

  vm-consensus-est-recent:
    if: >-
      contains(join(github.event.pull_request.labels.*.name, ' '), 'skip most stable VM') == false &&
      contains(join(github.event.pull_request.labels.*.name, ' '), 'test all hardforks') == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fork: [Prague, Osaka, Amsterdam]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
      - uses: ./.github/actions/consensus-fork
        with:
          source: tests
          manifest: fixtures.json
          cache-key: est-extract-tests-${{ hashFiles('packages/vm/test/consensus/fixtures.json') }}-${{ matrix.fork }}
          fork: ${{ matrix.fork }}
          artifact-prefix: consensus-est-failures

  vm-consensus-est-all-forks:
    needs: consensus-est-fork-matrix
    if: >-
      contains(join(github.event.pull_request.labels.*.name, ' '), 'skip most stable VM') == false &&
      contains(join(github.event.pull_request.labels.*.name, ' '), 'test all hardforks')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fork: ${{ fromJson(needs.consensus-est-fork-matrix.outputs.forks) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
      - uses: ./.github/actions/consensus-fork
        with:
          source: tests
          manifest: fixtures.json
          cache-key: est-extract-tests-${{ hashFiles('packages/vm/test/consensus/fixtures.json') }}-${{ matrix.fork }}
          fork: ${{ matrix.fork }}
          artifact-prefix: consensus-est-failures

  vm-consensus-bogota:
    if: >-
      github.event_name == 'pull_request' &&
      contains(join(github.event.pull_request.labels.*.name, ' '), 'test bogota') &&
      contains(join(github.event.pull_request.labels.*.name, ' '), 'skip dev VM') == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fork: [Bogota, AmsterdamToBogotaAtTime15k]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
      - uses: ./.github/actions/consensus-fork
        with:
          source: bogota-devnet
          manifest: fixtures.bogota.json
          cache-key: est-extract-bogota-${{ hashFiles('packages/vm/test/consensus/fixtures.bogota.json') }}-${{ matrix.fork }}
          fork: ${{ matrix.fork }}
          artifact-prefix: consensus-bogota-failures

  vm-consensus-legacy:
    if: contains(join(github.event.pull_request.labels.*.name, ' '), 'test all hardforks')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        legacy_fork:
          [
            'Prague',
            'Cancun',
            'Shanghai',
            'Paris',
            'London',
            'Berlin',
            'Istanbul',
            'ConstantinopleFix',
            'Byzantium',
            'EIP158',
            'EIP150',
            'Homestead',
            'Frontier',
          ]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
          ethereum-tests: 'true'
          ethereum-tests-key: ${{ inputs.submodule-cache-key }}

      - run: npm run test:consensus -- --source legacy --format blockchain --legacy-fork ${{ matrix.legacy_fork }}
