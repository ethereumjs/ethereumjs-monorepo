name: VM
on:
  workflow_call:
    inputs:
      dep-cache-key:
        required: true
        type: string
      submodule-cache-key:
        required: true
        type: string
      run-coverage:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      dep-cache-key:
        required: false
        default: 'none'
      submodule-cache-key:
        required: false
        default: 'none'
      run-coverage:
        required: false
        type: boolean
        default: true

env:
  cwd: ${{github.workspace}}/packages/vm
  RUN_COVERAGE: ${{ inputs.run-coverage }}
  EST_FIXTURES_CACHE: ${{ github.workspace }}/.est-fixtures-cache

defaults:
  run:
    working-directory: packages/vm

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-vm-pr
  cancel-in-progress: true

jobs:
  vm-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
          ethereum-tests: 'true'
          ethereum-tests-key: ${{ inputs.submodule-cache-key }}

      - run: |
          if [ "$RUN_COVERAGE" = "false" ]; then
            npm run test:API
          else
            npm run coverage
          fi

      - if: env.RUN_COVERAGE != 'false'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.cwd }}/coverage/lcov.info
          flags: vm

  est-fixtures-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: est-cache
        with:
          path: .est-fixtures-cache
          key: est-${{ hashFiles('packages/vm/test/consensus/fixtures.json') }}

      - name: Ensure tests fixtures
        run: npm run fixtures:fetch -- tests

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .est-fixtures-cache
          key: est-${{ hashFiles('packages/vm/test/consensus/fixtures.json') }}

  vm-consensus-est:
    needs: est-fixtures-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/4', '1/4', '2/4', '3/4']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: est-cache
        with:
          path: .est-fixtures-cache
          key: est-${{ hashFiles('packages/vm/test/consensus/fixtures.json') }}
          restore-keys: |
            est-${{ hashFiles('packages/vm/test/consensus/fixtures.json') }}

      - name: Ensure tests fixtures
        if: steps.est-cache.outputs.cache-hit != 'true'
        run: npm run fixtures:fetch -- tests

      - if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip most stable VM')
        run: npm run test:consensus:smoke

      - name: Consensus EST
        if: contains(join(github.event.pull_request.labels.*.name, ' '), 'skip most stable VM') == false
        continue-on-error: true
        id: consensus_est
        env:
          RUN_ALL: ${{ contains(join(github.event.pull_request.labels.*.name, ' '), 'test all hardforks') }}
        run: |
          EXTRA=""
          if [ "${{ steps.est-cache.outputs.cache-hit }}" = "true" ]; then EXTRA="--skip-fetch"; fi
          REPORT="$RUNNER_TEMP/consensus-est-failures.json"
          if [ "$RUN_ALL" = "true" ]; then
            npm run test:consensus:all -- --format all --shard ${{ matrix.shard }} --jobs 2 $EXTRA --report "$REPORT"
          else
            npm run test:consensus:pr -- --format all --shard ${{ matrix.shard }} --jobs 2 $EXTRA --report "$REPORT"
          fi

      - name: Upload consensus EST failure report
        if: steps.consensus_est.outcome == 'failure'
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: consensus-est-failures-${{ strategy.job-index }}
          path: ${{ runner.temp }}/consensus-est-failures.json
          retention-days: 14

      - name: Fail if consensus EST failed
        if: steps.consensus_est.outcome == 'failure'
        run: exit 1

  est-bogota-fixtures-cache:
    if: >-
      github.event_name == 'pull_request' &&
      contains(join(github.event.pull_request.labels.*.name, ' '), 'test bogota') &&
      contains(join(github.event.pull_request.labels.*.name, ' '), 'skip dev VM') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: est-bogota-cache
        with:
          path: .est-fixtures-cache
          key: est-${{ hashFiles('packages/vm/test/consensus/fixtures.json') }}

      - name: Fetch bogota-devnet fixtures
        run: npm run fixtures:fetch -- bogota-devnet

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && steps.est-bogota-cache.outputs.cache-hit != 'true'
        with:
          path: .est-fixtures-cache
          key: est-${{ hashFiles('packages/vm/test/consensus/fixtures.json') }}

  vm-consensus-bogota:
    if: >-
      github.event_name == 'pull_request' &&
      contains(join(github.event.pull_request.labels.*.name, ' '), 'test bogota') &&
      contains(join(github.event.pull_request.labels.*.name, ' '), 'skip dev VM') == false
    needs: est-bogota-fixtures-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: state
            shard: '0/2'
          - format: state
            shard: '1/2'
          - format: blockchain
            shard: '0/2'
          - format: blockchain
            shard: '1/2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .est-fixtures-cache
          key: est-${{ hashFiles('packages/vm/test/consensus/fixtures.json') }}
          restore-keys: |
            est-${{ hashFiles('packages/vm/test/consensus/fixtures.json') }}

      - run: >-
          npm run test:consensus:dev -- --format ${{ matrix.format }} --shard ${{ matrix.shard }} --jobs 2 --skip-fetch

  vm-consensus-legacy:
    if: contains(join(github.event.pull_request.labels.*.name, ' '), 'test all hardforks')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        legacy_fork:
          [
            'Prague',
            'Cancun',
            'Shanghai',
            'Paris',
            'London',
            'Berlin',
            'Istanbul',
            'ConstantinopleFix',
            'Byzantium',
            'EIP158',
            'EIP150',
            'Homestead',
            'Frontier',
          ]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
          ethereum-tests: 'true'
          ethereum-tests-key: ${{ inputs.submodule-cache-key }}

      - run: npm run test:consensus -- --source legacy --format blockchain --legacy-fork ${{ matrix.legacy_fork }}
