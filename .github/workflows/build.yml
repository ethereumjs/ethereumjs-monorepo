name: Build
on:
  pull_request:
    # synchronize / labeled re-read PR labels (test: browser, test: performance).
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:

env:
  cwd: ${{github.workspace}}

# Suffix `-build-v2`: stuck CodSpeed jobs on old Build runs can stay `in_progress`
# after cancel and block the whole group; bump the suffix to unblock without waiting
# for GitHub’s job timeout.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-build-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - id: keys
        run: echo "dep-cache-key=npm-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: npm-modules
        with:
          path: |
            **/node_modules
          key: npm-modules-${{ hashFiles('package-lock.json') }}

      - name: Use Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: 'npm'

      - name: Install
        if: steps.npm-modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: ${{ github.workspace }}

      # Cache hit skipped npm ci (and its postinstall build). Rebuild this commit.
      - name: Build packages
        if: steps.npm-modules.outputs.cache-hit == 'true'
        run: npm run build --workspaces --if-present
        working-directory: ${{ github.workspace }}

      - name: Verify public API export snapshots
        run: node --import tsx/esm --test scripts/public-api-snapshot.spec.mjs
        working-directory: ${{ github.workspace }}

      - name: Verify legacy ethereum/tests manifest
        run: node --test scripts/legacyEthereumTests.spec.mjs
        working-directory: ${{ github.workspace }}

      - name: Save node_modules
        if: steps.npm-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            **/node_modules
          key: npm-modules-${{ hashFiles('package-lock.json') }}

      - name: Save build workspace
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}
          key: ${{ steps.keys.outputs.dep-cache-key }}

    outputs:
      dep-cache-key: ${{ steps.keys.outputs.dep-cache-key }}

  # PR: tests for lowest-touched packages + dependents. Master / dispatch / shared
  # config (see scripts/ci-affected.mjs) still run the full matrix.
  # Keep skippable job ids in sync with SKIPPABLE_JOBS in that script.
  detect:
    runs-on: ubuntu-latest
    outputs:
      binarytree: ${{ steps.affected.outputs.binarytree }}
      block: ${{ steps.affected.outputs.block }}
      blockchain: ${{ steps.affected.outputs.blockchain }}
      browser: ${{ steps.affected.outputs.browser }}
      common: ${{ steps.affected.outputs.common }}
      evm: ${{ steps.affected.outputs.evm }}
      examples: ${{ steps.affected.outputs.examples }}
      mpt: ${{ steps.affected.outputs.mpt }}
      static: ${{ steps.affected.outputs.static }}
      statemanager: ${{ steps.affected.outputs.statemanager }}
      tx: ${{ steps.affected.outputs.tx }}
      util: ${{ steps.affected.outputs.util }}
      vm-pr: ${{ steps.affected.outputs['vm-pr'] }}
      binarytree_coverage: ${{ steps.affected.outputs.binarytree_coverage }}
      block_coverage: ${{ steps.affected.outputs.block_coverage }}
      blockchain_coverage: ${{ steps.affected.outputs.blockchain_coverage }}
      common_coverage: ${{ steps.affected.outputs.common_coverage }}
      evm_coverage: ${{ steps.affected.outputs.evm_coverage }}
      mpt_coverage: ${{ steps.affected.outputs.mpt_coverage }}
      static_coverage: ${{ steps.affected.outputs.static_coverage }}
      statemanager_coverage: ${{ steps.affected.outputs.statemanager_coverage }}
      tx_coverage: ${{ steps.affected.outputs.tx_coverage }}
      util_coverage: ${{ steps.affected.outputs.util_coverage }}
      vm-pr_coverage: ${{ steps.affected.outputs['vm-pr_coverage'] }}
      workspaces: ${{ steps.affected.outputs.workspaces }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1

      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Verify affected-job selector
        run: node --test scripts/ci-affected.spec.mjs

      - name: Compute affected CI jobs
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-affected.mjs

  binarytree:
    needs: [build, detect]
    if: needs.detect.outputs.binarytree == 'true'
    uses: ./.github/workflows/binarytree-build.yml
    secrets: inherit
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}
      run-coverage: ${{ needs.detect.outputs.binarytree_coverage == 'true' }}

  block:
    needs: [build, detect]
    if: needs.detect.outputs.block == 'true'
    uses: ./.github/workflows/block-build.yml
    secrets: inherit
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}
      run-coverage: ${{ needs.detect.outputs.block_coverage == 'true' }}

  blockchain:
    needs: [build, detect]
    if: needs.detect.outputs.blockchain == 'true'
    uses: ./.github/workflows/blockchain-build.yml
    secrets: inherit
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}
      run-coverage: ${{ needs.detect.outputs.blockchain_coverage == 'true' }}

  browser:
    needs: [build, detect]
    if: >-
      needs.detect.outputs.browser == 'true' &&
      (
        github.event_name != 'pull_request' ||
        contains(join(github.event.pull_request.labels.*.name, ' '), 'test: browser')
      )
    uses: ./.github/workflows/browser.yml
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}
      workspaces: ${{ needs.detect.outputs.workspaces }}

  common:
    needs: [build, detect]
    if: needs.detect.outputs.common == 'true'
    uses: ./.github/workflows/common-build.yml
    secrets: inherit
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}
      run-coverage: ${{ needs.detect.outputs.common_coverage == 'true' }}

  evm:
    needs: [build, detect]
    if: needs.detect.outputs.evm == 'true'
    uses: ./.github/workflows/evm-build.yml
    secrets: inherit
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}
      run-coverage: ${{ needs.detect.outputs.evm_coverage == 'true' }}

  examples:
    needs: [build, detect]
    if: needs.detect.outputs.examples == 'true'
    uses: ./.github/workflows/examples.yml
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}
      workspaces: ${{ needs.detect.outputs.workspaces }}

  mpt:
    needs: [build, detect]
    if: needs.detect.outputs.mpt == 'true'
    uses: ./.github/workflows/mpt-build.yml
    secrets: inherit
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}
      run-coverage: ${{ needs.detect.outputs.mpt_coverage == 'true' }}

  static:
    needs: [build, detect]
    if: needs.detect.outputs.static == 'true'
    uses: ./.github/workflows/rlp-ethash-genesis-wallet-build.yml
    secrets: inherit
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}
      run-coverage: ${{ needs.detect.outputs.static_coverage == 'true' }}

  statemanager:
    needs: [build, detect]
    if: needs.detect.outputs.statemanager == 'true'
    uses: ./.github/workflows/statemanager-build.yml
    secrets: inherit
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}
      run-coverage: ${{ needs.detect.outputs.statemanager_coverage == 'true' }}

  tx:
    needs: [build, detect]
    if: needs.detect.outputs.tx == 'true'
    uses: ./.github/workflows/tx-build.yml
    secrets: inherit
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}
      run-coverage: ${{ needs.detect.outputs.tx_coverage == 'true' }}

  util:
    needs: [build, detect]
    if: needs.detect.outputs.util == 'true'
    uses: ./.github/workflows/util-build.yml
    secrets: inherit
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}
      run-coverage: ${{ needs.detect.outputs.util_coverage == 'true' }}

  vm-pr:
    needs: [build, detect]
    if: needs.detect.outputs['vm-pr'] == 'true'
    uses: ./.github/workflows/vm-pr.yml
    secrets: inherit
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}
      run-coverage: ${{ needs.detect.outputs['vm-pr_coverage'] == 'true' }}

  lint:
    needs: build
    uses: ./.github/workflows/lint.yml
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}

  typecheck:
    needs: [build]
    uses: ./.github/workflows/typecheck.yml
    with:
      dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}

  audit:
    name: npm audit (runtime)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}

      - name: npm audit --omit=dev --audit-level=high
        run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ github.workspace }}

  # Sole required check: skipped package jobs count as success; failures fail the gate.
  ci-success:
    name: CI
    needs:
      - build
      - detect
      - binarytree
      - block
      - blockchain
      - browser
      - common
      - evm
      - examples
      - mpt
      - static
      - statemanager
      - tx
      - util
      - vm-pr
      - lint
      - typecheck
      - audit
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS)
            const failed = Object.entries(needs).filter(([, job]) => !["success", "skipped"].includes(job.result))
            if (failed.length > 0) {
              console.error(failed.map(([name, job]) => name + "=" + job.result).join("\n"))
              process.exit(1)
            }
            console.log("All required jobs passed or skipped")
          '

  bundle-size:
    needs: [build]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout current branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: dep-cache
        with:
          path: ${{github.workspace}}
          key: ${{ needs.build.outputs.dep-cache-key }}

      - name: Use Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: 'npm'

      - name: Install Dependencies (if not restored from cache)
        if: steps.dep-cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Checkout master for baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: master
          path: baseline-workspace

      - name: Build baseline
        working-directory: baseline-workspace
        run: |
          echo "📦 Installing baseline dependencies..."
          npm ci || echo "⚠️ npm ci failed, trying npm install..."
          npm install || echo "⚠️ npm install also failed"
          echo "🔨 Building baseline packages..."
          npm run build --workspaces --if-present || echo "⚠️ Build failed for some packages"
        continue-on-error: true

      - name: Check baseline build status
        working-directory: baseline-workspace
        run: |
          echo "📊 Checking if any packages were built..."
          BUILT_COUNT=0
          for pkg in packages/*/dist; do
            if [ -d "$pkg" ] && [ "$(find "$pkg" -name "*.js" -o -name "*.mjs" | wc -l)" -gt 0 ]; then
              BUILT_COUNT=$((BUILT_COUNT + 1))
              echo "✅ Found built package: $(dirname "$pkg" | xargs basename)"
            fi
          done
          echo "📦 Found $BUILT_COUNT packages with dist folders"
          if [ "$BUILT_COUNT" -eq 0 ]; then
            echo "⚠️ No packages were built in baseline. Comparison will be skipped."
            echo "BUILT_COUNT=0" >> $GITHUB_ENV
          else
            echo "BUILT_COUNT=$BUILT_COUNT" >> $GITHUB_ENV
          fi
        continue-on-error: true

      - name: Analyze baseline bundle sizes
        if: env.BUILT_COUNT != '0'
        working-directory: baseline-workspace
        run: |
          if [ ! -f scripts/bundle-size.mjs ]; then
            cp ../scripts/bundle-size.mjs scripts/
          fi
          echo "📊 Analyzing baseline bundle sizes..."
          node scripts/bundle-size.mjs --output=../baseline.json
          if [ ! -f ../baseline.json ]; then
            echo "❌ Baseline analysis failed - no file created"
            exit 1
          fi
          echo "✅ Baseline analysis complete"
          echo "Baseline file size: $(wc -c < ../baseline.json) bytes"
          echo "Baseline content preview:"
          head -5 ../baseline.json

      - name: Build current branch
        run: npm run build --workspaces --if-present
        working-directory: ${{ github.workspace }}

      - name: Analyze and compare bundle sizes
        id: bundle-analysis
        run: |
          if [ -f baseline.json ] && [ -s baseline.json ] && [ "$(cat baseline.json | tr -d '[:space:]')" != "{}" ]; then
            echo "✅ Baseline file is valid, running comparison..."
            node scripts/bundle-size.mjs --baseline=baseline.json > bundle-summary.md
          else
            echo "## 📦 Bundle size" > bundle-summary.md
            echo "" >> bundle-summary.md
            if [ ! -f baseline.json ]; then
              echo "Baseline comparison unavailable (baseline build failed or no packages were built)." >> bundle-summary.md
            elif [ ! -s baseline.json ]; then
              echo "Baseline comparison unavailable (baseline file is empty)." >> bundle-summary.md
            else
              echo "Baseline comparison unavailable (baseline contains no package data)." >> bundle-summary.md
            fi
          fi
          echo ""
          echo "📄 Bundle summary:"
          cat bundle-summary.md
        working-directory: ${{ github.workspace }}

      - name: Post bundle size summary to PR
        # Fork PRs run with a read-only GITHUB_TOKEN and cannot post comments
        # (403 "Resource not accessible by integration"). The bundle analysis
        # itself has already succeeded by this point, so never let the comment
        # step fail the job.
        continue-on-error: true
        if: steps.bundle-analysis.outcome == 'success' || steps.bundle-analysis.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryPath = path.join(process.env.GITHUB_WORKSPACE, 'bundle-summary.md');

            if (fs.existsSync(summaryPath)) {
              const summary = fs.readFileSync(summaryPath, 'utf-8');
              const commentBody = summary + '\n\n<sub>Generated by [bundle-size](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow</sub>';

              // Always surface the results in the job summary so they are
              // visible even when posting a PR comment is not permitted.
              await core.summary.addRaw(commentBody).write();

              try {
                // Find existing comment
                const comments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                });

                const existingComment = comments.data.find(
                  c => c.user.type === 'Bot' && c.body.includes('📦 Bundle size')
                );

                if (existingComment) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existingComment.id,
                    body: commentBody,
                  });
                  console.log('✅ Updated PR comment');
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: commentBody,
                  });
                  console.log('✅ Posted PR comment');
                }
              } catch (error) {
                // PRs from forks run with a read-only GITHUB_TOKEN and get a 403
                // when writing comments. That is expected — the summary above
                // still carries the results — so warn instead of failing.
                if (error.status === 403) {
                  core.warning(
                    'Skipping PR comment: the workflow token is read-only (expected for PRs from forks). ' +
                    'The bundle size summary is available in the job summary.'
                  );
                } else {
                  throw error;
                }
              }
            }

  # PR CodSpeed simulation — opt-in via test: performance (pull_request event for CodSpeed).
  # Master / manual runs stay in performance-benchmarks.yml. Not part of Build / CI.
  performance-benchmarks:
    name: Performance benchmarks
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    if: >-
      github.event_name == 'pull_request' &&
      contains(join(github.event.pull_request.labels.*.name, ' '), 'test: performance')
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # @codspeed/core 5.x prebuilds target Node 22 (Node 26 Linux hits V8 ABI errors).
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ needs.build.outputs.dep-cache-key }}
          node-version: '22'

      - name: Rebuild CodSpeed native module for bench Node
        run: npm rebuild @codspeed/core
        working-directory: ${{ github.workspace }}

      - name: Run benchmarks
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          mode: simulation
          run: npm run bench
          cache-instruments: 'true'
