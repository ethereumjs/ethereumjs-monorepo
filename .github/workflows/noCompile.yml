name: NoCompile
on:
  workflow_call:
    inputs:
      dep-cache-key:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      dep-cache-key:
        required: false
        default: 'none'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-noCompile
  cancel-in-progress: true

jobs:
  test-nocompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ethereumjs
        with:
          dep-cache-key: ${{ inputs.dep-cache-key }}
          node-version: '22'
          install-command: npm i --ignore-scripts

      - run: node --conditions=typescript --experimental-strip-types scripts/inlineClient.ts
        working-directory: ${{ github.workspace }}/packages/client
